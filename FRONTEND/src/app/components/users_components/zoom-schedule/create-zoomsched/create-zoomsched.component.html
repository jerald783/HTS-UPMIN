<div class="mx-auto my-6 max-w-2xl rounded-2xl bg-white p-6 shadow-xl border border-slate-100 transition-all duration-300" [class.animate-shake]="isSubmitted && zoomForm.invalid">
  
  <h3 class="mb-6 text-xl font-bold tracking-tight text-slate-800 sm:text-2xl">
    {{ isEditMode ? "Edit Zoom Schedule" : "Create Zoom Schedule" }}
  </h3>

  <form #zoomForm="ngForm" (ngSubmit)="saveSchedule(zoomForm)" [class.is-submitted]="isSubmitted" novalidate>
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
      
      <div class="flex flex-col relative group">
        <div class="flex justify-between items-center mb-1.5 min-h-[20px]">
          <label class="text-xs font-semibold text-slate-600">Zoom Topic</label>
          <span *ngIf="activityName.valid && formData.activityName" class="h-5 w-5 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-sm animate-scaleIn">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"></path></svg>
          </span>
        </div>
        <input
          type="text"
          placeholder="e.g., Q3 Project Review"
          [(ngModel)]="formData.activityName"
          name="activityName"
          #activityName="ngModel"
          required
          [class.border-rose-300]="(activityName.touched || isSubmitted) && activityName.invalid"
          [class.focus:ring-rose-100]="(activityName.touched || isSubmitted) && activityName.invalid"
          class="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-sm text-slate-800 placeholder-slate-400 outline-none transition-all focus:border-slate-400 focus:ring-2 focus:ring-slate-100"
        />
        <div class="mt-1.5 flex items-center gap-1.5 text-xs font-medium text-rose-500" *ngIf="(activityName.touched || isSubmitted) && activityName.invalid">
          <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"></path></svg>
          Topic is required
        </div>
      </div>

    Zoom Type is required

          type="text"
          placeholder="e.g., HR Department"
          [(ngModel)]="formData.officeUnitProject"
          name="officeUnitProject"
          #officeUnitProject="ngModel"
          required
          [class.border-rose-300]="(officeUnitProject.touched || isSubmitted) && officeUnitProject.invalid"
          [class.focus:ring-rose-100]="(officeUnitProject.touched || isSubmitted) && officeUnitProject.invalid"
          class="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-sm text-slate-800 placeholder-slate-400 outline-none transition-all focus:border-slate-400 focus:ring-2 focus:ring-slate-100"
        />
        <div class="mt-1.5 flex items-center gap-1.5 text-xs font-medium text-rose-500" *ngIf="(officeUnitProject.touched || isSubmitted) && officeUnitProject.invalid">
          <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"></path></svg>
          Required
        </div>
      </div>

      <div class="flex flex-col sm:col-span-2 relative group">
        <div class="flex justify-between items-center mb-1.5 min-h-[20px]">
          <label class="text-xs font-semibold text-slate-600">Additional Details</label>
          <span *ngIf="formData.additionalDetails && formData.additionalDetails.trim() !== ''" class="h-5 w-5 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-sm animate-scaleIn">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"></path></svg>
          </span>
        </div>
        <textarea
          placeholder="Any special setup instructions..."
          [(ngModel)]="formData.additionalDetails"
          name="additionalDetails"
          rows="2"
          class="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-sm text-slate-800 placeholder-slate-400 outline-none transition-all focus:border-slate-400 focus:ring-2 focus:ring-slate-100 resize-y"
        ></textarea>
      </div>

      <div class="flex flex-col sm:col-span-2 space-y-2">
        <label class="text-xs font-bold text-slate-700 tracking-wide block">Attach File (PDF / DOCX, max 10MB)</label>
        <div class="group relative flex items-center justify-center w-full">
          
          <label 
            class="flex flex-col items-center justify-center w-full min-h-[96px] py-4 border-2 border-slate-200 border-dashed rounded-xl cursor-pointer transition-all duration-200"
            [ngClass]="fileInput.files && fileInput.files.length > 0 ? 'bg-emerald-50/40 border-emerald-300 hover:bg-emerald-50/60' : 'bg-slate-50/30 hover:bg-slate-50/80 hover:border-slate-300'"
            (dragover)="$event.preventDefault()"
            (drop)="$event.preventDefault(); $event.dataTransfer && $event.dataTransfer.files && (fileInput.files = $event.dataTransfer.files) && onFileSelected({ target: { files: $event.dataTransfer.files } })"
          >
            <div class="flex items-center gap-3 px-4">
              
              <div 
                class="p-2 rounded-lg border shadow-sm transition-colors"
                [ngClass]="fileInput.files && fileInput.files.length > 0 ? 'bg-white border-emerald-200 text-emerald-600' : 'bg-white border-slate-200/60 text-slate-400 group-hover:text-slate-800'"
              >
                <svg *ngIf="!fileInput.files || fileInput.files.length === 0" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-8m0 8l-4-4m4 4l4-4M4 4h16v16H4V4z"></path>
                </svg>
                <svg *ngIf="fileInput.files && fileInput.files.length > 0" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
              
              <div class="text-left">
                <ng-container *ngIf="!fileInput.files || fileInput.files.length === 0">
                  <p class="text-xs text-slate-600 font-semibold"><span class="text-red-800 hover:underline">Upload file here</span> or drag drop here</p>
                  <p class="text-[10px] text-slate-400 font-normal">Supports PDF, DOC, or DOCX formats up to 10MB sizes.</p>
                </ng-container>

                <ng-container *ngIf="fileInput.files && fileInput.files.length > 0">
                  <p class="text-xs text-emerald-800 font-bold">Successfully Staged!</p>
                  <p class="text-[10px] text-emerald-600 font-medium truncate max-w-[320px] sm:max-w-[450px]">
                    📎 Prepared to upload: {{ fileInput.files[0].name }}
                  </p>
                </ng-container>
              </div>

            </div>

            <input 
              #fileInput
              type="file" 
              accept=".pdf,.doc,.docx"
              (change)="onFileSelected($event)" 
              class="hidden" 
            />
          </label>

        </div>
      </div>

    </div>

    <div class="mt-8 flex justify-end border-t border-slate-100 pt-4">
      <button 
        type="submit" 
        [disabled]="isSaving"
        class="inline-flex w-full items-center justify-center rounded-xl bg-slate-900 px-6 py-3 text-base font-semibold text-white shadow-md transition-all hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 sm:w-auto"
      >
        <span *ngIf="isSaving" class="mr-2 h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
        {{ isSaving ? "Saving..." : isEditMode ? "Update Schedule" : "Save Schedule" }}
      </button>
    </div>
  </form>
</div>
