  <!-- Mobile Top Header Bar -->
<header 
  *ngIf="isMobile" 
  class="fixed top-0 left-0 right-0 h-16 bg-[#630e10] border-b border-white/10 flex items-center justify-between px-4 z-30 shadow-md"
>
  <button 
    (click)="toggleSidenav()" 
    type="button" 
    aria-label="Toggle Navigation Menu"
    class="p-2 text-[#FDB813] hover:text-white hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-[#FDB813]/40 rounded-lg transition-colors"
  >
    <mat-icon class="text-xl">menu</mat-icon>
  </button>
  
  <div class="flex items-center gap-2.5">
    <img src="assets/img/UPM_LOGO1.png" alt="UP Mindanao Logo" class="w-7 h-7 rounded-full object-cover border border-[#FDB813]/40 shadow-sm" />
    <span class="text-sm font-semibold text-white tracking-wide">Helpdesk Ticketing</span>
  </div>

  <div class="w-8"></div>
</header>

<!-- Mobile Dark Overlay Backdrop -->
<div 
  *ngIf="isMobile && opened" 
  (click)="closeMobileMenu()"
  aria-hidden="true"
  class="fixed inset-0 bg-black/60 backdrop-blur-xs z-40 transition-opacity duration-300"
></div>

<!-- Responsive Sidenav/Drawer -->
<aside 
  aria-label="Main Navigation"
  class="fixed inset-y-0 left-0 flex flex-col bg-[#630e10] text-white/80 transition-all duration-300 ease-in-out z-50 border-r border-white/10 overflow-x-hidden"
  [ngClass]="{
    'translate-x-0': !isMobile || (isMobile && opened),
    '-translate-x-full': isMobile && !opened,
    'w-[280px]': !isCollapsed || isMobile,
    'w-20': isCollapsed && !isMobile
  }"
>
  <!-- Sidenav Header -->
  <div 
    class="flex items-center min-h-[64px] py-3 px-3.5 border-b border-white/10 bg-black/10 transition-all duration-300 overflow-hidden"
    [ngClass]="isCollapsed && !isMobile ? 'justify-center px-2' : 'justify-between gap-3'"
  >
    <!-- Logo Title -->
    <div class="flex items-center gap-3 min-w-0 flex-1 overflow-hidden" *ngIf="!isCollapsed || isMobile">
      <div class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center shadow-inner flex-shrink-0 border border-[#FDB813]/30">
        <img src="assets/img/UPM_LOGO1.png" alt="UP Mindanao Logo" class="w-7 h-7 rounded-full object-cover" />
      </div>
      <div class="flex flex-col min-w-0 flex-1 justify-center overflow-hidden">
        <span class="text-xs font-bold text-white tracking-wide leading-tight truncate">
          Helpdesk Ticketing
        </span>
        <span class="text-[10px] text-[#FDB813] font-medium leading-tight truncate mt-0.5">
          UP Mindanao Admin Panel
        </span>
      </div>
    </div>

    <!-- Toggle Button -->
    <button 
      (click)="toggleSidenav()" 
      type="button"
      [attr.aria-label]="isMobile ? 'Close menu' : 'Toggle collapsed menu'"
      class="p-2 rounded-xl text-white/70 hover:text-white hover:bg-white/10 transition-colors focus:outline-none flex-shrink-0 flex items-center justify-center"
    >
      <mat-icon class="text-xl">{{ isMobile ? 'close' : (isCollapsed ? 'menu' : 'menu_open') }}</mat-icon>
    </button>
  </div>

  <!-- Navigation Menu Items -->
  <nav class="flex-1 px-3 py-4 space-y-1.5 overflow-y-auto overflow-x-hidden">
    
    <!-- Dashboard -->
    <a
      (click)="closeMobileMenu()"
      [routerLink]="[{ outlets: { secondary: ['itoadmindashboard'] } }]"
      [routerLinkActive]="(isCollapsed && !isMobile) 
        ? 'bg-white/15 text-white shadow-sm ring-1 ring-[#FDB813]/40' 
        : 'bg-white/15 text-white font-semibold shadow-sm border-l-4 border-[#FDB813] rounded-r-xl rounded-l-xs'"
      [matTooltip]="isCollapsed && !isMobile ? 'Dashboard' : ''"
      matTooltipPosition="right"
      class="no-underline flex items-center transition-all hover:bg-white/10 hover:text-white cursor-pointer group text-white/80"
      [ngClass]="(isCollapsed && !isMobile) ? 'w-11 h-11 mx-auto justify-center rounded-xl' : 'px-3.5 py-2.5 rounded-xl gap-3'"
    >
      <div class="w-5 h-5 flex-shrink-0 flex items-center justify-center">
        <mat-icon class="text-[#FDB813] text-xl">dashboard</mat-icon>
      </div>
      <span *ngIf="!isCollapsed || isMobile" class="whitespace-nowrap overflow-hidden text-sm font-medium">
        Dashboard
      </span>
    </a>

    <!-- Master File Submenu -->
    <div class="space-y-1">
      <a 
        (click)="toggleMasterFileMenu(); $event.stopPropagation()" 
        [matTooltip]="isCollapsed && !isMobile ? 'Master File' : ''"
        matTooltipPosition="right"
        [attr.aria-expanded]="isMasterFileMenuOpen"
        class="no-underline flex items-center transition-all hover:bg-white/10 hover:text-white cursor-pointer group text-white/80"
        [ngClass]="(isCollapsed && !isMobile) 
          ? 'w-11 h-11 mx-auto justify-center rounded-xl' 
          : 'justify-between px-3.5 py-2.5 rounded-xl'"
      >
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="w-5 h-5 flex-shrink-0 flex items-center justify-center">
            <mat-icon class="text-white/70 group-hover:text-white text-xl transition-colors">folder</mat-icon>
          </div>
          <span *ngIf="!isCollapsed || isMobile" class="whitespace-nowrap overflow-hidden text-sm font-medium">
            Master File
          </span>
        </div>
        <mat-icon 
          *ngIf="!isCollapsed || isMobile" 
          class="text-white/40 group-hover:text-white text-lg transition-transform duration-200 flex-shrink-0"
          [class.rotate-180]="isMasterFileMenuOpen"
        >
          expand_more
        </mat-icon>
      </a>

      <!-- Master File Sub-links -->
      <div 
        *ngIf="!isCollapsed || isMobile"
        class="overflow-hidden transition-all duration-300 ease-in-out ml-5 pl-3 border-l border-white/15 space-y-1 mt-1"
        [class.max-h-96]="isMasterFileMenuOpen" 
        [class.max-h-0]="!isMasterFileMenuOpen"
      >
        <a
          (click)="closeMobileMenu()"
          [routerLink]="[{ outlets: { secondary: ['ia-tickets'] } }]"
          routerLinkActive="bg-white/15 text-white font-semibold border-l-2 border-[#FDB813] rounded-r-lg rounded-l-none"
          class="no-underline flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs text-white/70 hover:bg-white/10 hover:text-white transition-colors"
        >
          <mat-icon class="text-white/60 text-base">confirmation_number</mat-icon>
          <span class="truncate">Ticket Request</span>
        </a>

        <a
          (click)="closeMobileMenu()"
          [routerLink]="[{ outlets: { secondary: ['iazoomrequest'] } }]"
          routerLinkActive="bg-white/15 text-white font-semibold border-l-2 border-[#FDB813] rounded-r-lg rounded-l-none"
          class="no-underline flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs text-white/70 hover:bg-white/10 hover:text-white transition-colors"
        >
          <mat-icon class="text-white/60 text-base">event</mat-icon>
          <span class="truncate">Zoom Request</span>
        </a>
      </div>
    </div>

    <!-- Users -->
    <a
      (click)="closeMobileMenu()"
      [routerLink]="[{ outlets: { secondary: ['admin-register'] } }]"
      [routerLinkActive]="(isCollapsed && !isMobile) 
        ? 'bg-white/15 text-white shadow-sm ring-1 ring-[#FDB813]/40' 
        : 'bg-white/15 text-white font-semibold shadow-sm border-l-4 border-[#FDB813] rounded-r-xl rounded-l-xs'"
      [matTooltip]="isCollapsed && !isMobile ? 'Users' : ''"
      matTooltipPosition="right"
      class="no-underline flex items-center transition-all hover:bg-white/10 hover:text-white cursor-pointer group text-white/80"
      [ngClass]="(isCollapsed && !isMobile) ? 'w-11 h-11 mx-auto justify-center rounded-xl' : 'px-3.5 py-2.5 rounded-xl gap-3'"
    >
      <div class="w-5 h-5 flex-shrink-0 flex items-center justify-center">
        <mat-icon class="text-white/70 group-hover:text-white text-xl transition-colors">person</mat-icon>
      </div>
      <span *ngIf="!isCollapsed || isMobile" class="whitespace-nowrap overflow-hidden text-sm font-medium">
        Users
      </span>
    </a>

    <!-- Settings -->
    <a
      (click)="closeMobileMenu()"
      [routerLink]="[{ outlets: { secondary: ['iasettings'] } }]"
      [routerLinkActive]="(isCollapsed && !isMobile) 
        ? 'bg-white/15 text-white shadow-sm ring-1 ring-[#FDB813]/40' 
        : 'bg-white/15 text-white font-semibold shadow-sm border-l-4 border-[#FDB813] rounded-r-xl rounded-l-xs'"
      [matTooltip]="isCollapsed && !isMobile ? 'Settings' : ''"
      matTooltipPosition="right"
      class="no-underline flex items-center transition-all hover:bg-white/10 hover:text-white cursor-pointer group text-white/80"
      [ngClass]="(isCollapsed && !isMobile) ? 'w-11 h-11 mx-auto justify-center rounded-xl' : 'px-3.5 py-2.5 rounded-xl gap-3'"
    >
      <div class="w-5 h-5 flex-shrink-0 flex items-center justify-center">
        <mat-icon class="text-white/70 group-hover:text-white text-xl transition-colors">settings</mat-icon>
      </div>
      <span *ngIf="!isCollapsed || isMobile" class="whitespace-nowrap overflow-hidden text-sm font-medium">
        Settings
      </span>
    </a>

  </nav>

  <!-- Bottom User Profile Footer -->
  <div class="p-3 border-t border-white/10 bg-black/10 overflow-hidden">
    <button
      type="button"
      (click)="$event.stopPropagation()"
      [matMenuTriggerFor]="sharedUserMenu"
      aria-label="User Account Options"
      [matTooltip]="isCollapsed && !isMobile ? fullName : ''"
      matTooltipPosition="right"
      class="w-full flex items-center gap-3 p-2 rounded-xl hover:bg-white/10 transition-colors text-left focus:outline-none cursor-pointer"
      [ngClass]="(isCollapsed && !isMobile) ? 'justify-center p-0 w-11 h-11 mx-auto' : ''"
    >
      <div class="relative flex-shrink-0 w-9 h-9">
        <span
          *ngIf="fullName"
          class="w-9 h-9 rounded-full text-white font-bold text-xs flex items-center justify-center bg-white/20 border border-[#FDB813]/50 shadow-xs"
        >
          {{ getInitials(fullName) }}
        </span>
        <span class="w-2.5 h-2.5 rounded-full absolute bottom-0 right-0 bg-emerald-500 ring-2 ring-[#630e10]"></span>
      </div>

      <div class="flex flex-col min-w-0 flex-1 overflow-hidden text-left" *ngIf="!isCollapsed || isMobile">
        <span class="text-xs font-semibold text-white truncate leading-tight">{{ fullName }}</span>
        <span class="text-[11px] text-white/60 truncate leading-tight mt-0.5">{{ Email }}</span>
      </div>
    </button>
  </div>

</aside>

<!-- Logout Context Menu -->
<mat-menu #sharedUserMenu="matMenu" xPosition="before" class="custom-user-menu">
  <button mat-menu-item (click)="logOut()">
    <mat-icon class="!text-[#7B1113]">exit_to_app</mat-icon>
    <span class="text-sm font-medium text-[#7B1113]">Logout</span>
  </button>
</mat-menu>

<!-- Dynamic Content Area -->
<main 
  class="flex-1 transition-all duration-300 ease-in-out min-h-screen overflow-y-auto"
  [ngClass]="{
    'pt-16 ml-0': isMobile,
    'ml-[280px]': !isMobile && !isCollapsed,
    'ml-20': !isMobile && isCollapsed
  }"
>
  <router-outlet name="secondary"></router-outlet>
</main>
