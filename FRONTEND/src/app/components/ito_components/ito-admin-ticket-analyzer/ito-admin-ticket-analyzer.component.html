<!-- Control Bar -->
<div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-wrap items-center justify-between gap-4">
  <div class="flex flex-wrap items-center gap-4">
    <div class="flex items-center gap-2">
      <label for="fromDate" class="text-xs font-bold uppercase tracking-wider text-slate-500">From</label>
      <input 
        type="date" 
        id="fromDate" 
        [(ngModel)]="fromDate" 
        class="px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
      />
    </div>

    <div class="flex items-center gap-2">
      <label for="toDate" class="text-xs font-bold uppercase tracking-wider text-slate-500">To</label>
      <input 
        type="date" 
        id="toDate" 
        [(ngModel)]="toDate" 
        class="px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
      />
    </div>
  </div>

  <button 
    (click)="onAnalyzeAll()" 
    [disabled]="loading"
    class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-medium text-sm rounded-lg shadow-sm transition-all duration-150 disabled:cursor-not-allowed"
  >
    <svg *ngIf="loading" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <span>{{ loading ? 'Analyzing Diagnostics...' : 'Analyze Range Diagnostics' }}</span>
  </button>
</div>

<!-- Error Alert -->
<div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl flex items-center gap-3 text-red-700">
  <svg class="w-5 h-5 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
  </svg>
  <p class="text-sm font-medium">{{ errorMessage }}</p>
</div>

<!-- Report Card -->
<div *ngIf="analysisResult" class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
  <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2.5">
      <div class="p-2 bg-blue-100 text-blue-600 rounded-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
        </svg>
      </div>
      <h2 class="text-lg font-bold text-slate-800">Diagnostic Intelligence Report</h2>
    </div>
    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">
      {{ totalAnalyzed }} Tickets Analyzed
    </span>
  </div>

  <div class="p-6 report-content" [innerHTML]="analysisResult"></div>
</div>
