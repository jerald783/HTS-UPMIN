<!-- <div class="auth-container max-w-[400px] my-12 mx-auto p-8 sm:p-10 bg-white rounded-2xl shadow-xl text-center" style="font-family: 'Roboto', sans-serif;">
   -->
   <div class="flex items-center justify-center min-h-screen bg-slate-50 p-4 sm:p-6" style="font-family: 'Roboto', sans-serif;">
   <div class="w-full max-w-md bg-white rounded-2xl border-t-4 border-[#ffb81c] shadow-xl p-6 sm:p-8">
    
  <h2 class="text-2xl font-extrabold text-[#7A0000] mb-2 sm:text-[22px] tracking-tight">Forgot Password</h2>
  <p class="text-xs text-slate-500 mb-6 leading-relaxed max-w-xs mx-auto">
    Enter your institutional email address below to receive a secure password reset link.
  </p>

  <form (ngSubmit)="submit()" #forgotForm="ngForm" class="text-left">
    
    <div class="input-container relative mb-1.5 w-full">
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        id="forgotEmail"
        required
        [pattern]="emailPattern"
        placeholder=" "
        #emailInput="ngModel"
        autocomplete="email"
        class="peer w-full h-11 px-4 pt-1 border border-slate-200 rounded-xl text-sm font-medium text-slate-900 bg-slate-50/50 outline-none transition-all duration-200 focus:bg-white focus:border-[#7A0000] focus:ring-4 focus:ring-red-900/5"
      />
      
      <label for="forgotEmail" class="absolute left-4 top-1/2 -translate-y-1/2 bg-white px-1.5 text-sm font-medium text-slate-400 pointer-events-none transition-all duration-200 origin-left
        peer-focus:top-0 peer-focus:text-xs peer-focus:font-semibold peer-focus:text-[#7A0000]
        peer-[:not(:placeholder-shown)]:top-0 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:font-semibold peer-[:not(:placeholder-shown)]:text-[#7A0000]">
        Email Address
      </label>

      <span *ngIf="emailInput.valid && (emailInput.touched || emailInput.dirty)" class="absolute right-4 top-1/2 -translate-y-1/2 text-emerald-600 select-none flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 filter drop-shadow-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
      </span>
    </div>

    <div class="error-container min-h-[24px] mb-3 text-xs font-semibold text-red-600 px-1 flex items-center">
      <p *ngIf="emailInput.invalid && (emailInput.touched || emailInput.dirty)" class="transition-all duration-200">
        <span *ngIf="emailInput.errors?.['required']">Email address is required.</span>
        <span *ngIf="emailInput.errors?.['pattern']">Must be a valid &#64;up.edu.ph institutional profile.</span>
      </p>
    </div>

    <button 
      class="w-full h-11 text-sm font-semibold rounded-xl tracking-wide shadow-md shadow-red-950/10 transition-all duration-200
        enabled:bg-gradient-to-r enabled:from-[#7A0000] enabled:to-[#911414] enabled:text-white enabled:cursor-pointer enabled:hover:opacity-95 enabled:active:scale-[0.99]
        disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed disabled:shadow-none" 
      type="submit"
      [disabled]="forgotForm.invalid || isLoading"
    >
      {{ isLoading ? 'Processing Securely...' : 'Send Reset Link' }}
    </button>
  </form>
          <div class="flex text-xs font-semibold justify-center items-center pt-2">
    <a routerLink="/login" class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-700 hover:underline transition-colors duration-200 cursor-pointer">
      &larr; Back to Platform Login
    </a>
  </div>
</div>
</div>
