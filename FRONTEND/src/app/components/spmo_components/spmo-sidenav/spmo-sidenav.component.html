<div class="layout-wrapper">
  <mat-sidenav-container class="sidenav-wrapper">
    <!-- ================= SIDENAV ================= -->
    <mat-sidenav mode="side" [(opened)]="opened" class="app-sidenav">
      <!-- Logo Section -->
      <div class="logo-container">
        <img src="assets/img/SPMO.png" alt="SPMO" class="itsLogo" />
        <h2 class="system-title">Inventory Ticketing</h2>
        <span class="system-subtitle">SPMO Panel</span>
      </div>

      <!-- Navigation -->
      <mat-nav-list>
        <a
          mat-list-item
          routerLinkActive="active-link"
          [routerLink]="[{ outlets: { secondary: ['spmoassets'] } }]"
        >
          <mat-icon>home</mat-icon>
          <span>Home</span>
        </a>

        <a
          mat-list-item
          routerLinkActive="active-link"
          [routerLink]="[{ outlets: { secondary: ['dashboard'] } }]"
        >
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>

        <!-- Collapsible Master File -->
        <a mat-list-item (click)="toggleMasterFileMenu()" class="collapsible">
          <mat-icon>folder</mat-icon>
          <span>Master File</span>
          <span class="spacer"></span>
          <mat-icon class="expand-icon" [class.rotate]="isMasterFileMenuOpen">
            expand_more
          </mat-icon>
        </a>

        <div class="submenu" [class.open]="isMasterFileMenuOpen">
          <a
            mat-list-item
            routerLinkActive="active-link"
            [routerLink]="[{ outlets: { secondary: ['spmoassets'] } }]"
          >
            <mat-icon>inventory</mat-icon>
            <span>Assets</span>
          </a>

          <a
            mat-list-item
            routerLinkActive="active-link"
            [routerLink]="[{ outlets: { secondary: ['waste'] } }]"
          >
            <mat-icon>delete</mat-icon>
            <span>Waste Assets</span>
          </a>

          <a
            mat-list-item
            routerLinkActive="active-link"
            [routerLink]="[{ outlets: { secondary: ['dashboard'] } }]"
          >
            <mat-icon>category</mat-icon>
            <span>Components Name</span>
          </a>
        </div>

        <a
          mat-list-item
          routerLinkActive="active-link"
          [routerLink]="[{ outlets: { secondary: ['admin-register'] } }]"
        >
          <mat-icon>settings</mat-icon>
          <span>User</span>
        </a>
      </mat-nav-list>

      <!-- User Section (Bottom Fixed Like ITO) -->
      <div class="sidenav-user">
        <button mat-button class="user-btn" [matMenuTriggerFor]="userMenu">
          <div class="head-user-avatar">
            <span
              *ngIf="fullName"
              class="email-avatar"
              [style.background-color]="getAvatarColor(fullName)"
            >
              {{ getInitials(fullName) }}
            </span>
            <div class="circle-indicator pulse"></div>
          </div>

          <div class="user-details">
            <span class="user-name">{{ fullName }}</span>
            <span class="user-email">{{ Email }}</span>
          </div>
        </button>

        <mat-menu #userMenu="matMenu">
          <!-- <button mat-menu-item disabled>
            <mat-icon>person</mat-icon>
            <span>{{ fullName }}</span>
          </button>
          <button mat-menu-item (click)="logOut()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button> -->
        </mat-menu>
      </div>
    </mat-sidenav>

    <!-- ================= RIGHT SIDE ================= -->
    <mat-sidenav-content class="right-content">
      <!-- Toolbar -->
      <mat-toolbar class="app-toolbar">
        <!-- LEFT SIDE -->
        <div class="toolbar-left">
          <button class="menubtn" mat-icon-button (click)="opened = !opened">
            <mat-icon>{{ opened ? "menu_open" : "menu" }}</mat-icon>
          </button>
        </div>

        <!-- RIGHT SIDE -->
        <div class="toolbar-right">
          <button
            mat-button
            [matMenuTriggerFor]="headerUserMenu"
            class="user-btn"
          >
            <div class="head-user-avatar">
              <span
                *ngIf="fullName"
                class="email-avatar"
                [style.background-color]="getAvatarColor(fullName)"
              >
                {{ getInitials(fullName) }}
              </span>
              <div class="circle-indicator pulse"></div>
            </div>
          </button>

          <mat-menu #headerUserMenu="matMenu">
            <button mat-menu-item disabled>
              <mat-icon>person</mat-icon>
              <span>{{ fullName }}</span>
            </button>

            <button mat-menu-item (click)="logOut()">
              <mat-icon>logout</mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
        </div>
      </mat-toolbar>
      <!-- Main Content -->
      <div class="main-content">
        <div class="content-card">
          <router-outlet name="secondary"></router-outlet>
        </div>
      </div>

      <!-- Footer -->
      <footer>
        <div class="footer-content">
          SPMO • Inventory System v1.0.0
          <a href="#">Changelog</a>
        </div>
      </footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
